name: fieldly
description: "Fieldly (by Team Alpha): mobile-first field sales coordination app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  
  # Backend & Realtime
  supabase_flutter: ^2.5.6
  
  # Map & Location (OpenStreetMap free tier)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  
  # Background Tracking & Persistence
  flutter_background_service: ^5.0.8
  flutter_local_notifications: ^17.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  uuid: ^4.4.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
